# 로컬 개발용 PostgreSQL. 운영 배포 설정이 아니다.
#   docker compose -f server/compose.yaml up -d
# 호스트 포트는 5433 — 다른 프로젝트의 5432 와 겹치지 않게. application.yml 기본값과 같다.
# name 을 지우지 말 것 — 없으면 폴더 이름(server)이 프로젝트 이름이 되어 다른 리포의
# server/ compose 와 같은 프로젝트로 묶이고, up 이 그쪽 컨테이너를 멈추거나 교체한다.
name: session-warrant

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: warrant
      POSTGRES_USER: warrant
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - warrant-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warrant -d warrant"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 화면. PostgreSQL 을 직접 읽는다 — 설정과 대시보드는 deploy/grafana 에서 provisioning 한다.
  # http://localhost:3000 — 로그인 없이 보기 전용. 고치려면 admin 으로 들어가되, 저장은 JSON 에 한다.
  grafana:
    image: grafana/grafana-oss:13.0.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/unwarranted-sessions.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ../deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  warrant-pg:
