# 로컬 개발용 PostgreSQL. 운영 배포 설정이 아니다.
#   docker compose -f server/compose.yaml up -d
# 호스트 포트는 5433 — 다른 프로젝트의 5432 와 겹치지 않게. application.yml 기본값과 같다.
# name 을 지우지 말 것 — 없으면 폴더 이름(server)이 프로젝트 이름이 되어 다른 리포의
# server/ compose 와 같은 프로젝트로 묶이고, up 이 그쪽 컨테이너를 멈추거나 교체한다.
name: session-warrant

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: warrant
      POSTGRES_USER: warrant
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - warrant-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warrant -d warrant"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 중앙 서버를 운영 인스턴스와 같은 스펙으로 묶어 돌린다 — 부하 측정용(bench/serverload).
  #   cd server && ./gradlew bootJar
  #   docker compose -f compose.yaml --profile t3micro up -d --build
  # 평소 개발은 그대로 ./gradlew bootRun 이다. 이 서비스는 --profile t3micro 없이는 안 뜬다.
  #
  # 호스트 포트가 8081 · 9091 이라 bootRun(8080 · 9090)과 같이 떠 있어도 안 부딪힌다 —
  # 같은 부하를 두 스펙에 쏴서 비교할 수 있다. k6 는 --api · --addr 로 가리킨다.
  server:
    profiles: ["t3micro"]
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    # AWS t3.micro = 2 vCPU · 1 GiB. 버스트 크레딧은 흉내 낼 수 없다 — 아래 README 의 「같지 않은 것」.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    environment:
      # 컨테이너 안에서 DB 는 서비스 이름으로 보인다. 호스트의 5433 매핑이 아니다.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      # 기본은 dev(Basic 인증). oidc 는 발급자 주소가 호스트와 컨테이너에서 달라 그대로는 안 맞는다.
      SPRING_PROFILES_ACTIVE: ${SERVER_PROFILES:-dev}
      WARRANT_TLS_DIR: /pki
      # 서명키는 볼륨에 둔다 — 컨테이너를 다시 만들 때마다 새로 생기면 key id 가 바뀌어
      # 노드가 push 를 거부한다(노드의 /etc/warrantd/keys 와 어긋난다).
      WARRANT_SIGNING_KEY: /state/signing.key
    ports:
      - "${SERVER_PORT:-8081}:8080"
      - "${SERVER_GRPC_PORT:-9091}:9090"
    volumes:
      - ../.cache/pki:/pki:ro      # mtls 프로필일 때 서버 인증서 · CA
      - warrant-server-state:/state
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # 화면. PostgreSQL 을 직접 읽는다 — 설정과 대시보드는 deploy/grafana 에서 provisioning 한다.
  # http://localhost:3000 — 로그인 없이 보기 전용. 고치려면 admin 으로 들어가되, 저장은 JSON 에 한다.
  grafana:
    image: grafana/grafana-oss:13.0.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/unwarranted-sessions.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # 경보를 받을 웹훅. 기본값은 아래 alert-sink — 운영에서는 이 값을 바꾼다.
      GRAFANA_ALERT_WEBHOOK_URL: ${GRAFANA_ALERT_WEBHOOK_URL:-http://alert-sink:8080/grafana}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ../deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # 콘솔 로그인(OIDC). oidc 프로필에서만 쓴다: docker compose -f compose.yaml --profile oidc up -d
  # realm 은 처음 뜰 때 deploy/keycloak/warrant-realm.json 에서 들여오고, 사용자는 deploy/keycloak/seed-users.sh 로 넣는다.
  # 8180 — 서버가 8080 이라 Keycloak 기본 포트를 옮긴다. 관리 콘솔 http://localhost:8180/admin (개발용 admin 계정).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    profiles: ["oidc"]
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ../deploy/keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data

  # 로컬 경보 수신기. 받은 웹훅을 본문째 로그로 찍는다: docker compose -f server/compose.yaml logs -f alert-sink
  alert-sink:
    image: mendhak/http-https-echo:42
    environment:
      HTTP_PORT: 8080
      LOG_IGNORE_PATH: /healthz

volumes:
  keycloak-data:
  warrant-pg:
  warrant-server-state:
