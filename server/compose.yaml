# 로컬 개발용 PostgreSQL. 운영 배포 설정이 아니다.
#   docker compose -f server/compose.yaml up -d
# 호스트 포트는 5433 — 다른 프로젝트의 5432 와 겹치지 않게. application.yml 기본값과 같다.
# name 을 지우지 말 것 — 없으면 폴더 이름(server)이 프로젝트 이름이 되어 다른 리포의
# server/ compose 와 같은 프로젝트로 묶이고, up 이 그쪽 컨테이너를 멈추거나 교체한다.
name: session-warrant

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: warrant
      POSTGRES_USER: warrant
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - warrant-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warrant -d warrant"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 화면. PostgreSQL 을 직접 읽는다 — 설정과 대시보드는 deploy/grafana 에서 provisioning 한다.
  # http://localhost:3000 — 로그인 없이 보기 전용. 고치려면 admin 으로 들어가되, 저장은 JSON 에 한다.
  grafana:
    image: grafana/grafana-oss:13.0.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/unwarranted-sessions.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # 경보를 받을 웹훅. 기본값은 아래 alert-sink — 운영에서는 이 값을 바꾼다.
      GRAFANA_ALERT_WEBHOOK_URL: ${GRAFANA_ALERT_WEBHOOK_URL:-http://alert-sink:8080/grafana}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ../deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # 콘솔 로그인(OIDC). oidc 프로필에서만 쓴다: docker compose -f compose.yaml --profile oidc up -d
  # realm 은 처음 뜰 때 deploy/keycloak/warrant-realm.json 에서 들여오고, 사용자는 deploy/keycloak/seed-users.sh 로 넣는다.
  # 8180 — 서버가 8080 이라 Keycloak 기본 포트를 옮긴다. 관리 콘솔 http://localhost:8180/admin (개발용 admin 계정).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    profiles: ["oidc"]
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ../deploy/keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data

  # 로컬 경보 수신기. 받은 웹훅을 본문째 로그로 찍는다: docker compose -f server/compose.yaml logs -f alert-sink
  alert-sink:
    image: mendhak/http-https-echo:42
    environment:
      HTTP_PORT: 8080
      LOG_IGNORE_PATH: /healthz

volumes:
  keycloak-data:
  warrant-pg:
