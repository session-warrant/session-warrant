# mtls 프로필 — 노드 ↔ 중앙 gRPC(:9090)를 TLS 로, 노드는 클라이언트 인증서가 있어야 붙는다.
#   SPRING_PROFILES_ACTIVE=oidc,mtls ./gradlew bootRun
# 인증서는 deploy/pki/pki.sh 가 만든다(기본 위치 ../.cache/pki — server/ 에서 띄울 때 기준). 다른 곳이면 WARRANT_TLS_DIR.
# 사내 CA(ca.pem)가 서명한 노드 인증서만 받는다. 노드 신원은 그 인증서의 sha256 지문이다(GrpcConfig · NodePeer).
spring:
  ssl:
    bundle:
      pem:
        node-grpc:
          keystore:
            certificate: file:${WARRANT_TLS_DIR:../.cache/pki}/server.pem
            private-key: file:${WARRANT_TLS_DIR:../.cache/pki}/server.key
          truststore:
            certificate: file:${WARRANT_TLS_DIR:../.cache/pki}/ca.pem
  grpc:
    server:
      ssl:
        enabled: true
        bundle: node-grpc
        client-auth: require

warrant:
  node-tls:
    required: true      # 인증서 없는 호출은 TLS 설정이 어떻게 되든 거부한다(GrpcConfig.nodeCertificate)
