spring:
  application:
    name: warrant-server

  threads:
    virtual:
      enabled: true          # WebFlux 대신 이걸로 간다

  datasource:
    url: jdbc:postgresql://localhost:5432/warrant
    username: warrant
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: validate     # 스키마는 Flyway 가 만든다. auto-ddl 로 만들지 않는다
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${OIDC_ISSUER:http://localhost:8080/realms/warrant}
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:warrant-server}
            client-secret: ${OIDC_CLIENT_SECRET:}
            scope: openid,profile,email

grpc:
  server:
    port: 9090
    # 노드 인증은 mTLS. 영장 스트림에는 정책 전체가 흐른다

warrant:
  # 시간 정책의 핵심은 넉넉히 주는 게 아니라 짧게 주고 연장을 싸게 만드는 것이다(§03).
  # 이 기본값을 크게 잡으면 제품의 전제가 무너진다.
  default-duration: PT30M

  extension:
    cumulative-cap-multiplier: 3    # 원 기간의 3배. 넘으면 연장이 아니라 재발급 — 예외 없음
    auto-approve:
      enabled: true
      max-count: 2                  # read-only 영장 한정
      max-total-multiplier: 2
      # 쓰기 규칙이 하나라도 있는 영장은 항상 사람이 승인한다. 이 값으로 우회되지 않는다

  grace:
    max-window: PT2H                # 무기한 유예는 존재하지 않는다(§03)

  signing:
    key-path: ${WARRANT_SIGNING_KEY:/etc/warrant/signing.key}
