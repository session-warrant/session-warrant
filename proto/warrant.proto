// 영장 스키마 — struct warrant · 서버 Warrant 엔티티 · warrantd 맵 값의 단일 원본.
// 규칙과 결정 근거는 proto/README.md.

syntax = "proto3";

package seswar.warrant.v1;

option java_package = "io.seswar.warrant.proto";
option java_outer_classname = "WarrantProtos";
option java_multiple_files = false;  // 도메인 클래스와 이름이 겹친다 → WarrantProtos.Warrant
option go_package = "github.com/session-warrant/session-warrant/agent/internal/pb;pb";

// 발급 · 연장 · 취소가 전부 이 봉투 하나로 내려간다. 취소 = revoked=true 인 새 revision.
message SignedWarrant {
  bytes warrant = 1;    // Warrant 직렬화 바이트. 재직렬화하지 말고 이 바이트 그대로 검증 · 보관
  bytes signature = 2;  // Ed25519, 64바이트
  string key_id = 3;    // 키 교체 중 공존하는 두 키를 가른다
}

message Warrant {
  fixed64 warrant_id = 1;   // 커널 맵 키. 재사용 금지, revision 이 올라도 불변
  string warrant_uuid = 2;  // 서버 PK. 커널로 안 내려간다
  string display_id = 3;    // 예: W-4821-3F
  uint32 revision = 4;      // 발급 1, 연장 · 취소마다 +1. 노드는 더 큰 것만 적용

  uint32 subject_id = 10;     // = Subject.kernelSubjectId. 신원은 이것
  string principal = 11;      // 예: paul@seswar.io
  string login_account = 12;  // 예: ec2-user. PAM 바인딩 키일 뿐 신원이 아니다
  repeated string ssh_key_fingerprints = 13;  // "SHA256:..." 공유 계정에서 사람을 가르는 키. 빈 목록 = 바인딩 안 됨

  repeated string target_hosts = 20;  // 노드는 자기 hostname 이 없으면 거부
  string reason = 21;

  // 시각은 전부 절대시각(Unix ns). boot 기준 변환은 warrantd 가 한다.
  fixed64 issued_at_unix_ns = 30;
  fixed64 expires_at_unix_ns = 31;
  fixed64 grace_window_ns = 32;  // 기간. SESSION_ONLY_GRACE 에서만, 0 = 유예 없음

  bool revoked = 40;
  Mode mode = 41;
  OnExpiry on_expiry = 42;

  uint32 policy_id = 50;  // rule_* 맵 키의 앞부분
  Policy policy = 51;     // 영장과 함께 서명된다

  bool break_glass = 60;  // 자기보호를 풀 수 있는 유일한 영장. 일반 발급 경로로는 못 켠다
}

// 값이 커널 상수와 같아야 한다.
enum Mode {
  MODE_OBSERVE = 0;
  MODE_DRYRUN  = 1;  // verdict = WOULD_DENY
  MODE_ENFORCE = 2;  // -EPERM. BPF LSM 이 켜진 노드에서만
}

enum OnExpiry {
  ON_EXPIRY_DEMOTE             = 0;  // 세션은 살고 쓰기 · 아웃바운드만 죽는다
  ON_EXPIRY_KILL               = 1;  // scope 일괄 종료
  ON_EXPIRY_SESSION_ONLY_GRACE = 2;  // 셸만 끊고 nohup 잡은 grace_window 동안 유지
}

// 읽기 규칙과 자기보호 6종은 여기 없다.
message Policy {
  string name = 1;
  repeated ExecRule exec_rules = 2;    // 화이트리스트
  repeated WriteRule write_rules = 3;
  repeated NetRule net_rules = 4;      // 비어 있으면 아웃바운드 전면 차단
  bool inspect_udp = 5;                // socket_sendmsg 부착. 기본 false

  // 비어 있으면 BPF 가 읽기 경로를 보지 않는다. 구현은 inode 먼저 + 직접 load (README 2)
  repeated string read_watch_paths = 6;
}

message ExecRule {
  string path = 1;  // 절대 경로 → warrantd 가 (dev, ino) 로 컴파일
}

// 최장 일치 → 길이가 같으면 DENY → 안 걸리면 금지. 목록 순서는 무의미하다.
message WriteRule {
  enum Effect {
    EFFECT_ALLOW = 0;
    EFFECT_DENY  = 1;
  }

  string path = 1;  // DENY 는 반드시 디렉터리
  bool recursive = 2;
  Effect effect = 3;
}

message NetRule {
  string cidr = 1;  // IPv4 · IPv6
  uint32 port = 2;  // 0 = 모든 포트
  Proto proto = 3;  // UDP 규칙은 inspect_udp=true 일 때만 강제된다
}

enum Proto {
  PROTO_ANY = 0;
  PROTO_TCP = 1;
  PROTO_UDP = 2;
}
