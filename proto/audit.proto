// 감사 이벤트 — 커널 ringbuf 레코드가 warrantd 를 거쳐 중앙에 도착하는 형태.
// 필드 출처는 docs/session-warrant-ebpf-fields.html. 증거는 (dev, ino) 이고 경로 · argv · comm 은 참고다.

syntax = "proto3";

package seswar.warrant.v1;

import "warrant.proto";

option java_package = "io.seswar.warrant.proto";
option java_outer_classname = "AuditProtos";
option java_multiple_files = false;
option go_package = "github.com/session-warrant/session-warrant/agent/internal/pb;pb";

// bpf/warrant.bpf.h 의 hook_id 와 1:1. 훅 부착 순서대로.
enum Hook {
  HOOK_UNSPECIFIED = 0;
  HOOK_SCHED_PROCESS_FORK    = 1;
  HOOK_BPRM_CHECK_SECURITY   = 2;
  HOOK_SOCKET_CONNECT        = 3;
  HOOK_FILE_OPEN             = 4;
  HOOK_INODE_CREATE          = 5;
  HOOK_INODE_UNLINK          = 6;
  HOOK_INODE_RENAME          = 7;
  HOOK_INODE_LINK            = 8;
  HOOK_INODE_SYMLINK         = 9;
  HOOK_BPF                   = 10;  // 10~14 자기보호
  HOOK_TASK_KILL             = 11;
  HOOK_SB_UMOUNT             = 12;
  HOOK_PTRACE_ACCESS_CHECK   = 13;
  HOOK_KERNEL_MODULE_REQUEST = 14;
  HOOK_SOCKET_SENDMSG        = 15;
  HOOK_AGENT                 = 100;  // warrantd 유저 공간 발
}

enum Verdict {
  VERDICT_ALLOW      = 0;
  VERDICT_DENY       = 1;  // 실제로 -EPERM
  VERDICT_WOULD_DENY = 2;  // OBSERVE · DRYRUN 이라 기록만
}

// 필드 번호 ≤15 는 1바이트 태그다. 전건에 실리는 필드와 고빈도 payload 를 거기 둔다.
message AuditEvent {
  fixed64 node_seq = 1;  // 노드 단위 단조 증가. (node_id, seq_epoch, node_seq) 가 서버 멱등 키
  uint32 cpu = 2;        // (cpu, cpu_seq) 가 건너뛰면 유실. HOOK_AGENT 는 0
  fixed64 cpu_seq = 3;
  Hook hook = 4;
  Verdict verdict = 5;
  Mode mode = 6;                 // WOULD_DENY 가 OBSERVE 인지 DRYRUN 인지 가른다
  fixed64 boot_ts_ns = 7;        // bpf_ktime_get_boot_ns()
  fixed64 wall_ts_unix_ns = 8;   // warrantd 변환값. 서버 파티션 키

  fixed64 warrant_id = 9;  // 0 = 무영장
  uint32 subject_id = 10;
  uint32 policy_id = 11;
  TagSource tag_source = 12;

  ProcessIdentity process = 13;

  oneof payload {
    ExecEvent exec = 14;
    FileWriteEvent file_write = 15;
    InodeMutateEvent inode_mutate = 16;
    ConnectEvent connect = 17;
    UdpSendEvent udp_send = 18;
    SelfProtectionEvent self_protection = 19;
    ForkEvent fork = 20;

    UnwarrantedSessionEvent unwarranted_session = 30;
    DelegationAttemptEvent delegation_attempt = 31;
    GraceEvent grace = 32;
    ShellCommandLineEvent shell_command_line = 33;
  }

  Origin origin = 34;  // lsm 과 kprobe 미러의 판정이 다르면 버그
}

enum Origin {
  ORIGIN_UNSPECIFIED = 0;
  ORIGIN_LSM    = 1;
  ORIGIN_KPROBE = 2;
  ORIGIN_AGENT  = 3;
}

enum TagSource {
  TAG_NONE   = 0;  // 무영장
  TAG_CGROUP = 1;  // cgroup_warrant
  TAG_TASK   = 2;  // task_warrant (fork 전파). cgroup 을 벗어난 프로세스
}

message ProcessIdentity {
  uint32 pid = 1;
  uint32 tgid = 2;
  fixed64 start_time_ns = 3;  // (pid, start_time) 이 유일 키
  uint32 ppid = 4;            // real_parent->tgid
  uint32 uid = 5;
  uint32 euid = 6;
  uint32 gid = 7;
  string comm = 8;            // 16바이트로 잘리고 위조 가능
  fixed64 cgroup_id = 9;
  fixed32 pid_ns_inum = 10;   // exit 중이면 0
  fixed32 mnt_ns_inum = 11;
}

message FileRef {
  fixed32 dev = 1;   // s_dev (u32)
  fixed64 ino = 2;
  string path = 3;   // 차단 건에만 채운다. 증거 아님
}

// lsm/bprm_check_security
message ExecEvent {
  FileRef file = 1;
  uint32 i_mode = 2;      // setuid 탐지
  string filename = 3;
  string interp = 4;      // filename 과 다르면 스크립트 실행
  string argv = 5;        // 잘리고 위조 가능
  bool argv_truncated = 6;
  uint32 new_uid = 7;
  uint32 new_euid = 8;
}

// lsm/file_open 쓰기 차단. 허용은 WriteAggregate 로.
message FileWriteEvent {
  FileRef file = 1;
  FileRef parent = 2;
  uint32 f_flags = 3;  // O_TRUNC · O_APPEND · O_CREAT
}

// lsm/inode_{create,unlink,rename,link,symlink}
message InodeMutateEvent {
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_CREATE  = 1;
    OP_UNLINK  = 2;
    OP_RENAME  = 3;
    OP_LINK    = 4;
    OP_SYMLINK = 5;
  }

  Op op = 1;
  FileRef dir = 2;
  string name = 3;
  FileRef new_dir = 4;  // rename · link 의 반대편
  string new_name = 5;
  string symlink_target = 6;
}

// lsm/socket_connect
message ConnectEvent {
  enum Family {
    FAMILY_UNSPECIFIED = 0;
    FAMILY_UNIX  = 1;
    FAMILY_INET  = 2;
    FAMILY_INET6 = 10;
  }

  Family family = 1;
  bytes addr = 2;      // 네트워크 바이트 오더, 4 또는 16바이트
  uint32 port = 3;
  string sun_path = 4;
  bool abstract = 5;   // sun_path[0] == 0. 없으면 abstract 소켓이 빈 이름으로 보인다
  uint32 sock_type = 6;
}

// lsm/socket_sendmsg. inspect_udp 일 때만
message UdpSendEvent {
  ConnectEvent destination = 1;
  fixed64 size = 2;
}

message SelfProtectionEvent {
  enum Kind {
    KIND_UNSPECIFIED     = 0;
    KIND_BPF_SYSCALL     = 1;
    KIND_KILL_PROTECTED  = 2;  // 대상이 warrantd · sshd
    KIND_UMOUNT_BPFFS    = 3;
    KIND_PTRACE_UNTAGGED = 4;
    KIND_MODULE_REQUEST  = 5;
    KIND_SELF_FILE_WRITE = 6;  // warrantd 바이너리 · 유닛 파일
  }

  Kind kind = 1;
  uint32 bpf_cmd = 2;
  uint32 signal = 3;
  uint32 target_tgid = 4;
  string module_name = 5;
  FileRef file = 6;
}

// 기본값은 기록하지 않는다. 디버깅용
message ForkEvent {
  uint32 child_pid = 1;
  fixed64 child_start_time_ns = 2;
}

// 차단하지 않고 기록 · 경보만
message UnwarrantedSessionEvent {
  enum Reason {
    REASON_UNSPECIFIED     = 0;
    REASON_NO_WARRANT      = 1;
    REASON_AGENT_UNREACHED = 2;  // PAM fail-open
    REASON_CENTRAL_STALE   = 3;  // 중앙 단절 중 캐시 수명 초과
    REASON_PAM_ABSENT      = 4;  // pam_warrant.so 없이 생긴 scope
    REASON_NO_KEY          = 5;  // 공개키 인증이 아님(password 등) · SSH_AUTH_INFO_0 없음
    REASON_KEY_MISMATCH    = 6;  // 계정엔 영장이 있으나 이 키의 것이 아님 — 남의 영장에 편승 시도
  }

  string login_account = 1;
  string source_address = 2;  // PAM_RHOST
  fixed64 cgroup_id = 3;
  string session_id = 4;      // XDG_SESSION_ID. 재사용되므로 참고용
  Reason reason = 5;
  string ssh_key_fingerprint = 6;  // 비어 있으면 REASON_NO_KEY. 이 값으로 사람을 역추적한다
}

message DelegationAttemptEvent {
  enum Vector {
    VECTOR_UNSPECIFIED     = 0;
    VECTOR_SYSTEMD_PRIVATE = 1;  // /run/systemd/private
    VECTOR_DBUS_SYSTEM     = 2;  // /run/dbus/system_bus_socket
    VECTOR_DOCKER_SOCK     = 3;
    VECTOR_SPOOL_WRITE     = 4;  // /var/spool (at · cron)
    VECTOR_EXEC            = 5;  // systemd-run · systemctl · at · crontab · docker
  }

  Vector vector = 1;
  string detail = 2;
}

message GraceEvent {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_ENTERED = 1;
    PHASE_CLOSED  = 2;  // 유예 잡이 전부 끝남
    PHASE_EXPIRED = 3;  // grace_window 초과
  }

  Phase phase = 1;
  uint32 surviving_processes = 2;
}

// bash readline uprobe. 보조 증거
message ShellCommandLineEvent {
  string line = 1;
}

// 허용된 쓰기의 집계
message WriteAggregate {
  fixed64 warrant_id = 1;
  fixed64 bucket_start_unix_ns = 2;
  fixed64 bucket_ns = 3;
  fixed64 allowed_count = 4;
}

// 유실 구간. 빈 구간을 숨기지 않는다
message GapReport {
  enum Cause {
    CAUSE_UNSPECIFIED      = 0;
    CAUSE_RINGBUF_OVERFLOW = 1;
    CAUSE_AGENT_DOWN       = 2;
    CAUSE_LOCAL_STORE_FULL = 3;  // 중앙 단절 중 bbolt 상한 초과
    CAUSE_CPU_SEQ_SKIP     = 4;  // 원인 불명
  }

  fixed64 from_unix_ns = 1;
  fixed64 to_unix_ns = 2;
  fixed64 dropped_count = 3;
  bool dropped_count_known = 4;
  Cause cause = 5;
}
