// warrantd ↔ 중앙 gRPC 계약. mTLS. 채널이 끊겨도 노드의 집행은 계속된다.
// PAM ↔ warrantd 소켓은 protobuf 를 쓰지 않는다.

syntax = "proto3";

package seswar.warrant.v1;

import "warrant.proto";
import "audit.proto";

option java_package = "io.seswar.warrant.proto";
option java_outer_classname = "AgentProtos";
option java_multiple_files = false;
option go_package = "github.com/session-warrant/session-warrant/agent/internal/pb;pb";

service WarrantPushService {
  // 활성 집합 전체 → ResyncComplete → 이후 변경분.
  // 노드는 ResyncComplete 에서 집합 밖의 캐시 영장을 지운다.
  rpc Subscribe(SubscribeRequest) returns (stream PushMessage);

  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // T-5분 자동 연장 요청. 결과는 새 revision push 로 온다.
  rpc RequestExtension(ExtensionRequest) returns (ExtensionAck);

  // warrantd 캐시가 비었을 때만. 타임아웃이면 노드는 fail-open.
  rpc LookupActiveWarrant(LookupRequest) returns (LookupResponse);
}

message SubscribeRequest {
  NodeHello node = 1;
  map<fixed64, uint32> cached_revisions = 2;  // warrant_id → revision. 진단용
}

message NodeHello {
  string hostname = 1;
  string kernel_version = 2;
  bool bpf_lsm_enabled = 3;       // false 면 ENFORCE 가 강제되지 않는다
  fixed64 booted_at_unix_ns = 4;  // 스큐 진단용. 서버는 이걸로 계산하지 않는다
  string agent_version = 5;
  repeated Hook attached_hooks = 6;
}

message PushMessage {
  oneof body {
    SignedWarrant warrant = 1;
    ResyncComplete resync_complete = 2;
  }
  reserved 3;  // kill_switch — 서명 없이 전 훅을 여는 메시지였다. 강제 모드 때 서명 봉투로 다시 설계
  reserved "kill_switch";
}

message ResyncComplete {
  uint32 active_count = 1;
}

message HeartbeatRequest {
  NodeHello node = 1;
  uint32 active_warrants = 2;        // 커널 맵 기준
  fixed64 ringbuf_dropped_total = 3; // 부팅 이후 누적
}

message HeartbeatResponse {
  uint32 expected_active_warrants = 1;  // 어긋나면 노드가 재구독
}

message ExtensionRequest {
  fixed64 warrant_id = 1;
  string detected_workload = 2;  // 예: "deploy.sh (pid 4821) 실행 중, 쓰기 12건/분"
  fixed64 requested_extension_ns = 3;
}

message ExtensionAck {
  enum Outcome {
    OUTCOME_UNSPECIFIED      = 0;
    OUTCOME_PENDING_APPROVAL = 1;
    OUTCOME_AUTO_APPROVED    = 2;
    OUTCOME_DUPLICATE        = 3;
    OUTCOME_CAP_EXCEEDED     = 4;  // 연장이 아니라 재발급 대상
    OUTCOME_REJECTED         = 5;
  }

  Outcome outcome = 1;
  string message = 2;
}

message LookupRequest {
  string hostname = 1;
  string login_account = 2;
  string ssh_key_fingerprint = 3;  // Warrant.ssh_key_fingerprints 와 같은 형식. 비어 있으면 서버는 빈 응답
}

message LookupResponse {
  repeated SignedWarrant warrants = 1;  // 비어 있으면 무영장. 셋 다 일치한 것만. 서버 불변식상 최대 1개
}

service AuditIngestService {
  // 서버는 적재한 지점까지 ack, 노드는 그 이하를 bbolt 에서 지운다.
  // 재전송이 전제이므로 서버는 (node_id, seq_epoch, node_seq) 로 멱등하게 받는다.
  // node_id 는 mTLS 클라이언트 인증서에서 뽑는다. 노드가 적어 보내는 hostname 은 키가 아니다.
  rpc Stream(stream AuditBatch) returns (stream AuditAck);
}

message AuditBatch {
  NodeHello node = 1;  // 첫 배치에만
  repeated AuditEvent events = 2;
  repeated WriteAggregate write_aggregates = 3;
  repeated GapReport gaps = 4;  // 이벤트와 같은 스트림이어야 순서가 맞는다
  fixed64 last_node_seq = 5;
  fixed64 seq_epoch = 6;  // bbolt 초기화 때 새로 뽑는 난수. node_seq 가 1 로 되돌아가도 옛 키와 안 겹친다
}

message AuditAck {
  fixed64 seq_epoch = 2;  // 어느 epoch 의 ack 인가. 다르면 노드는 무시한다
  fixed64 acked_through_node_seq = 1;
}
